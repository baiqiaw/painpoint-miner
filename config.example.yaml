# PainPoint Miner 配置文件模板
# 复制此文件为 config.yaml 并根据需要修改

scraping:
  platforms:
    - xiaohongshu
    - weibo
    - douyin
    - zhihu
  max_posts_per_keyword: 100
  max_comments_per_post: 50
  scrape_timeout_seconds: 300
  rate_limit:
    tikhub_requests_per_minute: 60
    twitter_requests_per_minute: 30
    global_daily_limit: 5000

analysis:
  mode: "merged"
  llm_model: "claude-haiku-4-5-20251001"
  batch_size: 15
  max_concurrent_llm_requests: 5
  max_llm_budget_usd: 10.0
  embedding:
    model: "intfloat/multilingual-e5-large"
  clustering:
    algorithm: "hdbscan"
    min_cluster_size: 3
  dedup:
    similarity_threshold: 0.9

export:
  output_dir: "./output"
  formats:
    - markdown
    - json
    - excel

privacy:
  anonymize: true
  retention_days: 30
  attribution_mode: false

proxy:
  enabled: false
  url: ""
