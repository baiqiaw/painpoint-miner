[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "painpoint-miner"
version = "0.1.0"
description = "Multi-platform social media pain point scraper and analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings[yaml]>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiofiles>=23.0",
    "tweepy>=4.14",
    "anthropic>=0.40",
    "scikit-learn>=1.3",
    "fastembed>=0.4",
    "aiosqlite>=0.19",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "tenacity>=8.2",
    "rich>=13.0",
    "click>=8.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
twitter-scrape = ["twscrape>=0.12"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "pytest-cov>=5.0",
]

[project.scripts]
painpoint-miner = "painpoint_miner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that require real API keys (deselect with '-m \"not live\"')",
]

[tool.coverage.run]
source = ["painpoint_miner"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
